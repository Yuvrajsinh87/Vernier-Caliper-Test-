<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>વર્નિયર કેલિપર રીડિંગ ઓનલાઈન ટેસ્ટ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f5; margin: 0; padding: 15px; }
        .container { max-width: 820px; background: white; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a252f; margin-bottom: 5px; font-size: 24px; }
        .author-tag { text-align: center; font-size: 14px; font-weight: bold; color: #0d6efd; background: #e7f1ff; padding: 10px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #b6d4fe; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; }
        input[type="text"], input[type="tel"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        
        .question-card { background: #ffffff; padding: 18px; margin-bottom: 20px; border: 1px solid #dee2e6; border-left: 6px solid #0d6efd; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .question-title { font-weight: bold; font-size: 1.1em; color: #2c3e50; margin-bottom: 12px; }
        
        /* Fixed Clear Box Styling */
        .vernier-box { text-align: center; background: #0f172a; padding: 15px; border-radius: 8px; margin: 12px 0; overflow-x: auto; }
        .vernier-svg { width: 100%; max-width: 750px; height: auto; display: block; margin: 0 auto; }
        
        .legend { display: flex; justify-content: center; gap: 20px; font-size: 14px; font-weight: bold; margin-bottom: 12px; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-box { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
        
        .submit-btn { background: #198754; color: white; border: none; padding: 14px 20px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.3s; margin-top: 10px; }
        .submit-btn:hover { background: #157347; }
        
        /* Answer Key Styling */
        .review-card { background: #ffffff; padding: 18px; margin-bottom: 20px; border-radius: 8px; border: 2px solid #ccc; text-align: left; }
        .review-card.correct { border-color: #198754; border-left: 8px solid #198754; }
        .review-card.incorrect { border-color: #dc3545; border-left: 8px solid #dc3545; }
        
        .ans-info { font-size: 16px; margin-top: 8px; padding: 8px; border-radius: 5px; }
        .ans-info.correct-bg { background-color: #d1e7dd; color: #0f5132; }
        .ans-info.incorrect-bg { background-color: #f8d7da; color: #842029; }

        #quiz-area, #result-area { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>વર્નિયર કેલિપર રીડિંગ ઓનલાઈન ટેસ્ટ</h2>
    <div class="author-tag">Test Created by Yuvrajsinh Kosamia - ITI Ankleshwar (Mechanic Diesel)</div>

    <!-- ૧. રજીસ્ટ્રેશન ફોર્મ -->
    <div id="registration">
        <div class="form-group">
            <label>તાલીમાર્થીનું નામ:</label>
            <input type="text" id="traineeName" placeholder="તમારું પૂરૂં નામ લખો" required>
        </div>
        <div class="form-group">
            <label>મોબાઈલ નંબર:</label>
            <input type="tel" id="traineeMobile" placeholder="10 અંકનો મોબાઈલ નંબર" required>
        </div>
        <button class="submit-btn" onclick="startQuiz()">ટેસ્ટ શરૂ કરો</button>
    </div>

    <!-- ૨. ક્વિઝ એરિયા (૧૦ પ્રશ્નો) -->
    <div id="quiz-area">
        <form id="quizForm">
            <div id="questionsContainer"></div>
            <button type="button" class="submit-btn" onclick="submitQuiz()">આખી ટેસ્ટ સબમિટ કરો</button>
        </form>
    </div>

    <!-- ૩. રિઝલ્ટ અને આન્સર કી એરિયા -->
    <div id="result-area" style="text-align: center;">
        <h3 style="color: #198754; font-size: 24px; margin-bottom: 5px;">તમારી ટેસ્ટ સફળતાપૂર્વક સબમિટ થઈ ગઈ છે!</h3>
        <p id="scoreText" style="font-size: 22px; font-weight: bold; color: #1a252f; background: #e9ecef; padding: 12px; border-radius: 8px;"></p>
        
        <h4 style="text-align: left; color: #0d6efd; margin-top: 25px; font-size: 20px; border-bottom: 2px solid #0d6efd; padding-bottom: 5px;">તમારી આન્સર કી (Answer Key):</h4>
        <div id="answerKeyContainer"></div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzdAg0vv-sWwcEfSQytap-L5L0sioEHND-EdH3ssdtHhN5IDaghifwcqJMkY51F92bTrw/exec';
    
    let traineeData = {};
    let selectedQuestions = [];

    // બગ-ફ્રી અને ૧૦૦% વિઝિબલ SVG જનરેટર
    function generateFixedVernierSVG(totalValue) {
        let val = parseFloat(totalValue);
        let mainScale = Math.floor(val);
        let vernierDiv = Math.round((val - mainScale) * 50); // 0 થી 49 (LC = 0.02mm)

        let scaleFactor = 13; // 1 mm = 13px
        let startX = 50;
        let vernierZeroX = startX + (val * scaleFactor);

        // Main Scale Lines
        let mainScaleLines = '';
        for (let i = 0; i <= 45; i++) {
            let x = startX + (i * scaleFactor);
            let isTen = (i % 10 === 0);
            let isFive = (i % 5 === 0);
            let h = isTen ? 30 : (isFive ? 20 : 13);
            
            mainScaleLines += `<line x1="${x}" y1="75" x2="${x}" y2="${75 - h}" stroke="#ffffff" stroke-width="${isTen ? 2.2 : (isFive ? 1.8 : 1.2)}"/>`;
            if (isTen) {
                mainScaleLines += `<text x="${x}" y="${75 - 34}" font-size="12" font-weight="bold" text-anchor="middle" fill="#38bdf8">${i}</text>`;
            }
        }

        // Vernier Scale Lines
        let vernierLines = '';
        let matchedX = 0;

        for (let i = 0; i <= 50; i++) {
            let vx = vernierZeroX + (i * 0.98 * scaleFactor);
            let isTen = (i % 10 === 0);
            let isFive = (i % 5 === 0);
            let h = isTen ? 26 : (isFive ? 18 : 12);

            let isCoinciding = (i === vernierDiv);
            if (isCoinciding) {
                matchedX = vx;
            }

            let lineColor = isCoinciding ? "#22c55e" : "#fbbf24";
            let lineWidth = isCoinciding ? 3 : (isTen ? 2 : 1.2);

            vernierLines += `<line x1="${vx}" y1="85" x2="${vx}" y2="${85 + h}" stroke="${lineColor}" stroke-width="${lineWidth}"/>`;
            if (isTen) {
                vernierLines += `<text x="${vx}" y="${85 + 40}" font-size="11" font-weight="bold" text-anchor="middle" fill="${isCoinciding ? '#22c55e' : '#a7f3d0'}">${i/5}</text>`;
            }
        }

        return `
        <div class="vernier-box">
            <div class="legend">
                <div class="legend-item"><span class="legend-box" style="background:#ef4444;"></span> <span style="color:#f87171;">૧. વર્નિયર ૦ પોઈન્ટર (મેઈન સ્કેલ)</span></div>
                <div class="legend-item"><span class="legend-box" style="background:#22c55e;"></span> <span style="color:#4ade80;">૨. મેચિંગ કાપો (વર્નિયર ડિવિઝન)</span></div>
            </div>

            <!-- viewBox માં Height 210px રાખી જેથી લખાણ કે કાપા કપાય નહીં -->
            <svg class="vernier-svg" viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg">
                <rect width="100%" height="100%" fill="#0f172a" rx="6"/>
                
                <!-- Main Beam -->
                <rect x="20" y="25" width="680" height="55" fill="#1e293b" stroke="#475569" stroke-width="2"/>
                ${mainScaleLines}
                
                <!-- Vernier Slider Plate -->
                <rect x="${vernierZeroX - 20}" y="80" width="660" height="90" fill="#334155" stroke="#94a3b8" stroke-width="2" rx="4"/>
                
                <!-- વર્નિયર ૦ (ઝીરો) રેડ ઇન્ડિકેટર લાઈન -->
                <line x1="${vernierZeroX}" y1="25" x2="${vernierZeroX}" y2="85" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,2"/>
                <circle cx="${vernierZeroX}" cy="85" r="4.5" fill="#ef4444"/>
                
                <!-- Vernier Scale Lines -->
                ${vernierLines}
                
                <!-- મેચિંગ ડિવિઝન ગ્રીન ઇન્ડિકેટર લાઈન -->
                <line x1="${matchedX}" y1="25" x2="${matchedX}" y2="135" stroke="#22c55e" stroke-width="2" stroke-dasharray="3,3"/>
                <circle cx="${matchedX}" cy="75" r="4.5" fill="#22c55e"/>
                <circle cx="${matchedX}" cy="85" r="4.5" fill="#22c55e"/>
            </svg>
        </div>`;
    }

    function generateQuestions() {
        let questions = [];
        for (let i = 0; i < 40; i++) {
            let mainScale = Math.floor(Math.random() * 26);
            let vernierDiv = Math.floor(Math.random() * 50);
            
            let totalReading = (mainScale + (vernierDiv * 0.02)).toFixed(2);
            
            questions.push({
                mainScale: mainScale,
                vernierDiv: vernierDiv,
                correctAnswer: totalReading
            });
        }
        return questions.sort(() => 0.5 - Math.random()).slice(0, 10);
    }

    function startQuiz() {
        const name = document.getElementById('traineeName').value.trim();
        const mobile = document.getElementById('traineeMobile').value.trim();

        if (name === "" || mobile.length !== 10) {
            alert("કૃપા કરીને તમારું પૂરું નામ અને ૧૦ અંકનો મોબાઈલ નંબર દાખલ કરો.");
            return;
        }

        traineeData.name = name;
        traineeData.mobile = mobile;

        document.getElementById('registration').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'block';

        selectedQuestions = generateQuestions();

        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';

        selectedQuestions.forEach((q, index) => {
            const qDiv = document.createElement('div');
            qDiv.className = 'question-card';
            
            const svgCode = generateFixedVernierSVG(q.correctAnswer);
            
            qDiv.innerHTML = `
                <div class="question-title">પ્રશ્ન ${index + 1}: આકૃતિમાં દર્શાવેલ વર્નિયર કેલિપરનું સાચું રીડિંગ શોધો (mm માં)</div>
                ${svgCode}
                <div class="form-group">
                    <label>તમારો જવાબ (mm):</label>
                    <input type="number" step="0.02" id="ans_${index}" placeholder="દા.ત. 12.34" required>
                </div>
            `;
            container.appendChild(qDiv);
        });
        window.scrollTo(0, 0);
    }

    function submitQuiz() {
        let score = 0;
        let userAnswers = [];
        let allAnswered = true;

        for (let i = 0; i < selectedQuestions.length; i++) {
            const inputVal = document.getElementById(`ans_${i}`).value.trim();
            if (inputVal === "") {
                allAnswered = false;
                break;
            }
            userAnswers.push(parseFloat(inputVal).toFixed(2));
        }

        if (!allAnswered) {
            alert("કૃપા કરીને બધા ૧૦ પ્રશ્નોના જવાબ પૂર્ણ કરો.");
            return;
        }

        selectedQuestions.forEach((q, index) => {
            if (userAnswers[index] === q.correctAnswer) {
                score++;
            }
        });

        traineeData.score = `${score} / 10`;

        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('scoreText').innerText = `${traineeData.name}, તમારો કુલ સ્કોર: ${traineeData.score}`;

        const answerKeyContainer = document.getElementById('answerKeyContainer');
        answerKeyContainer.innerHTML = '';

        selectedQuestions.forEach((q, index) => {
            const isCorrect = (userAnswers[index] === q.correctAnswer);
            const reviewCard = document.createElement('div');
            reviewCard.className = `review-card ${isCorrect ? 'correct' : 'incorrect'}`;
            
            const svgCode = generateFixedVernierSVG(q.correctAnswer);
            let vernierValue = (q.vernierDiv * 0.02).toFixed(2);

            reviewCard.innerHTML = `
                <div class="question-title" style="margin-bottom: 5px;">
                    પ્રશ્ન ${index + 1}: ${isCorrect ? '<span style="color:#198754;">✔️ સાચો જવાબ</span>' : '<span style="color:#dc3545;">❌ ખોટો જવાબ</span>'}
                </div>
                ${svgCode}
                <div class="ans-info ${isCorrect ? 'correct-bg' : 'incorrect-bg'}">
                    <strong>તમે આપેલો જવાબ:</strong> ${userAnswers[index]} mm<br>
                    <strong>ગણતરી ની સમજૂતી:</strong> મેઈન સ્કેલ (${q.mainScale} mm) + વર્નિયર સ્કેલ (${q.vernierDiv} × 0.02 = ${vernierValue} mm) = <strong>${q.correctAnswer} mm</strong>
                </div>
            `;
            answerKeyContainer.appendChild(reviewCard);
        });

        window.scrollTo(0, 0);

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(traineeData)
        }).catch(error => console.error('Error!', error.message));
    }
</script>

</body>
</html>
